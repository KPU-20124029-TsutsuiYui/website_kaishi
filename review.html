<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口コミ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1 class="heading">KAISHI Caffe</h1>
        
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <nav id="nav">
            <ul>
                <li><a href="index.html">ホーム</a></li>
                <li><a href="menu.html">メニュー</a></li>
                <li><a href="access.html">アクセス</a></li>
                <li><a href="review.html">口コミ</a></li>
            </ul>
        </nav>
    </header>
    
    <section id="review-section" class="section">
        <h2>口コミ投稿</h2>
        
        <div class="review-form">
            <div class="select-container">
                <select id="categorySelect">
                    <option value="">カテゴリーを選択</option>
                </select>
                <select id="menuSelect">
                    <option value="">メニューを選択</option>
                </select>
            </div>

            <textarea id="comment" rows="4" placeholder="コメントを入力"></textarea>
            
            <div class="star-rating" id="starRating">
                <span class="star" data-value="1">&#9733;</span>
                <span class="star" data-value="2">&#9733;</span>
                <span class="star" data-value="3">&#9733;</span>
                <span class="star" data-value="4">&#9733;</span>
                <span class="star" data-value="5">&#9733;</span>
            </div>
            
            <button id="submitReview">送信</button>
        </div>

        <div class="delete-all-container">
            <button id="deleteAllReviews">全ての口コミを削除</button>
        </div>
        
        <div class="filters-wrapper">
            <div class="filter-group">
                <label for="ratingFilter">評価：</label>
                <select id="ratingFilter">
                    <option value="all">指定なし</option>
                    <option value="1">星1</option>
                    <option value="2">星2</option>
                    <option value="3">星3</option>
                    <option value="4">星4</option>
                    <option value="5">星5</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="categoryFilter">カテゴリー：</label>
                <select id="categoryFilter">
                    <option value="all">指定なし</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="menuFilter">メニュー：</label>
                <select id="menuFilter">
                    <option value="all">指定なし</option>
                </select>
            </div>
        </div>

        <div class="sort-container">
            <label for="sortSelect">並び替え：</label>
            <select id="sortSelect">
                <option value="newest">新しい順</option>
                <option value="oldest">古い順</option>
                <option value="ratingDesc">評価の高い順</option>
                <option value="ratingAsc">評価の低い順</option>
            </select>
        </div>

        <div id="reviewList" class="review-list">
            <!-- 投稿がここに追加される -->
        </div>
    </section>
    
    <script src="js/review.js"></script>
    <script src="js/hamburger.js"></script>
    
</body>
</html>
